<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="I am just Valra :3" />
    <link rel="icon" type="image/png" href="./static/imgs/pfp.png" />
    <title>Valra :3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/animations.css" />
    <style>
      body {
        position: relative;
        overflow-x: hidden;
        background: #120b1f;
      }

      body::before {
        content: "";
        position: fixed;
        z-index: 0;
        inset: -18px;
        background-image: url("./static/gif/background.gif");
        background-size: cover;
        background-position: center;
        filter: blur(8px) saturate(0.8) brightness(0.7) contrast(1.05);
        opacity: 0.85;
        transform: scale(1.04);
      }

      body::after {
        content: "";
        position: fixed;
        z-index: 0;
        inset: 0;
        background:
          radial-gradient(circle at 20% 20%, rgba(128, 58, 180, 0.2), transparent 45%),
          linear-gradient(135deg, rgba(28, 5, 48, 0.45), rgba(74, 25, 105, 0.2), rgba(10, 4, 20, 0.5));
        mix-blend-mode: multiply;
        opacity: 0.7;
        pointer-events: none;
      }

      body > * {
        position: relative;
        z-index: 1;
      }

      #socials,
      #socials > *,
      #socials a {
        position: relative;
        z-index: 100;
        pointer-events: auto;
      }
    </style>
    <script type="module" src="./core/main.js"></script>
  </head>

  <body class="min-h-screen bg-[#120b1f] text-white antialiased selection:bg-purple-400/30">
    <main class="mx-auto flex min-h-screen w-full max-w-5xl items-center justify-center px-4 py-10 sm:px-6 sm:py-16">
      <section class="profile-card fade-in-up relative w-full min-w-0 overflow-visible rounded-3xl border border-purple-900/80 bg-[#1b102b]/80 shadow-lg backdrop-blur-xl" style="--fade-delay: 0ms">
        <div class="ambient-glow" aria-hidden="true">
          <span class="glow-orb glow-orb-one"></span>
          <span class="glow-orb glow-orb-two"></span>
          <span class="glow-orb glow-orb-three"></span>
          <span class="glow-orb glow-orb-four"></span>
        </div>
        <div class="relative">
          <div class="fade-in-up overflow-hidden rounded-t-3xl" style="--fade-delay: 100ms">
            <img
              src="./static/imgs/banner.png"
              alt="Valra's banner"
              class="h-44 w-full object-cover"
            />
          </div>

          <div class="fade-in-up absolute -bottom-36 left-1/2 z-20 flex w-40 -translate-x-1/2 flex-col items-center text-center md:-bottom-56 md:left-12 md:translate-x-0" style="--fade-delay: 200ms">
            <div id="status-bubble" class="relative top-8 mb-3 flex translate-x-8 flex-col items-center"></div>
            <img
              src="./static/imgs/pfp.png"
              alt="Valra's profile picture"
              class="h-40 w-40 rounded-full object-cover object-center"
            />
            <p class="mt-3 text-2xl font-semibold text-purple-100">Valra</p>
          </div>
        </div>

        <div class="fade-in-up min-w-0 p-5 pt-36 sm:p-12 sm:pt-36 md:pt-8" style="--fade-delay: 200ms">
          <div class="flex flex-col items-center gap-10 md:flex-row md:items-center">
          <div class="h-0 w-40 shrink-0" aria-hidden="true"></div>

          <div class="min-w-0 flex-1 text-center md:text-left">
            <div id="welcome-pill"></div>
            <p id="description" class="mt-5 max-w-3xl text-base leading-7 text-slate-300 sm:text-lg">
                
            </p>

            <h2 class="mt-8 text-sm font-semibold uppercase tracking-[0.25em] text-purple-300">Projects</h2>
            <div id="projects" class="mt-3"></div>
            <h2 class="mt-8 text-sm font-semibold uppercase tracking-[0.25em] text-purple-300">Socials</h2>
            <div id="socials" class="mt-3 min-w-0"></div>
            <p class="mt-10 text-xs text-slate-500"></p>
            <h2 class="mt-8 text-sm font-semibold uppercase tracking-[0.25em] text-purple-300">Silly stuff</h2>
            <div id="misc" class="mt-3 min-w-0"></div>
          </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
