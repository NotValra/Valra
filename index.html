<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="I am just Valra :3" />
    <link rel="icon" type="image/png" href="./static/imgs/pfp.webp" />
    <title>Valra :3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/animations.css" />
    <style>
      body {
        position: relative;
        overflow-x: hidden;
        background: #120b1f;
      }

      body::before {
        content: "";
        position: fixed;
        z-index: 0;
        inset: -18px;
        background-image: url("./static/animated/background.webp");
        background-size: cover;
        background-position: center;
        filter: blur(8px) saturate(0.8) brightness(0.7) contrast(1.05);
        opacity: 0.85;
        transform: scale(1.04);
      }

      body::after {
        content: "";
        position: fixed;
        z-index: 0;
        inset: 0;
        background:
          radial-gradient(circle at 20% 20%, rgba(128, 58, 180, 0.2), transparent 45%),
          linear-gradient(135deg, rgba(28, 5, 48, 0.45), rgba(74, 25, 105, 0.2), rgba(10, 4, 20, 0.5));
        mix-blend-mode: multiply;
        opacity: 0.7;
        pointer-events: none;
      }

      body > * {
        position: relative;
        z-index: 1;
      }

      #socials-section,
      #socials-section > *,
      #socials-section a {
        position: relative;
        z-index: 100;
        pointer-events: auto;
      }
    </style>
    <script type="module" src="./core/main.js"></script>
  </head>

  <body class="min-h-screen bg-[#120b1f] text-white antialiased selection:bg-purple-400/30">
    <main class="mx-auto flex min-h-screen w-full max-w-5xl items-center justify-center px-4 py-10 sm:px-6 sm:py-16">
      <section class="profile-card fade-in-up relative w-full min-w-0 overflow-visible rounded-3xl border-2 border-purple-900/80 bg-[#1b102b]/80 shadow-lg backdrop-blur-xl" style="--fade-delay: 0ms">
        <div class="ambient-glow" aria-hidden="true">
          <span class="glow-orb glow-orb-one"></span>
          <span class="glow-orb glow-orb-two"></span>
          <span class="glow-orb glow-orb-three"></span>
          <span class="glow-orb glow-orb-four"></span>
        </div>
        <div class="relative">
          <div class="fade-in-up overflow-hidden rounded-t-3xl" style="--fade-delay: 100ms">
            <img
              src="./static/imgs/banner.webp"
              alt="Valra's banner"
              class="h-56 w-full object-cover"
            />
          </div>

          <div class="fade-in-up -mt-20 flex flex-col items-center gap-5 px-5 text-center sm:px-12 md:flex-row md:items-end md:gap-6 md:text-left" style="--fade-delay: 200ms">
            <div class="relative flex w-40 shrink-0 flex-col items-center">
              <div id="status-bubble" class="absolute -right-6 -top-12 flex flex-col items-center"></div>
              <img
                src="./static/imgs/pfp.webp"
                alt="Valra's profile picture"
                class="h-40 w-40 rounded-full object-cover object-center"
              />
              <p class="mt-3 text-2xl font-semibold text-purple-100">Valra</p>
            </div>
          </div>
        </div>

        <div class="fade-in-up min-w-0 p-5 pt-8 sm:p-12 sm:pt-10" style="--fade-delay: 200ms">
          <div class="min-w-0">
            <h2 class="text-sm font-semibold uppercase tracking-[0.25em] text-purple-300">About Me</h2>
            <p id="description" class="mt-5 max-w-4xl space-y-2 text-left text-base leading-8 text-slate-300 sm:text-lg">
                
            </p>

            <h2 class="mt-8 text-sm font-semibold uppercase tracking-[0.25em] text-purple-300">Projects</h2>
            <div id="projects" class="mt-3"></div>
            <h2 class="mt-8 text-sm font-semibold uppercase tracking-[0.25em] text-purple-300">Socials</h2>
            <div id="socials-section" class="mt-3 min-w-0"></div>
            <p class="mt-10 text-xs text-slate-500"></p>
            <h2 class="mt-8 text-sm font-semibold uppercase tracking-[0.25em] text-purple-300">Github Sponsors &lt;3</h2>
            <div id="sponsors-section" class="mt-3 min-w-0"></div>
            <h2 class="mt-8 text-sm font-semibold uppercase tracking-[0.25em] text-purple-300">Art</h2>
            <div id="art-section" class="mt-3 min-w-0"></div>
            <h2 class="mt-8 text-sm font-semibold uppercase tracking-[0.25em] text-purple-300">Silly stuff</h2>
            <div id="misc" class="mt-3 min-w-0"></div>
            <h2 class="mt-8 text-sm font-semibold uppercase tracking-[0.25em] text-purple-300">bleh</h2>
            <div id="bleh-section" class="mt-3 min-w-0"></div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
